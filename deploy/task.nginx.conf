server {
    listen 127.0.0.1:8080;
    server_name task.rbym47.com;

    include /etc/nginx/snippets/security-headers.inc;
    include /etc/nginx/snippets/passkey-gate-endpoints.inc;
    client_max_body_size 64k;

    location ~ ^/(app\.js|style\.css)?$ {
        limit_except GET { deny all; }
        auth_request /_gate/check;
        error_page 401 = /_gate/redirect;
        include /etc/nginx/snippets/task-readonly-upstream.inc;
    }
    location = /api/read {
        limit_except POST { deny all; }
        auth_request /_gate/check;
        error_page 401 = @task_unauthorized;
        include /etc/nginx/snippets/task-readonly-upstream.inc;
    }
    location = /api/events {
        limit_except GET { deny all; }
        auth_request /_gate/check;
        error_page 401 = @task_unauthorized;
        include /etc/nginx/snippets/task-readonly-upstream.inc;
    }
    location @task_unauthorized {
        default_type application/json;
        add_header Cache-Control no-store always;
        return 401 '{"error":"UNAUTHORIZED","message":"Access denied"}';
    }
    # Never proxy tools, health, version, lifecycle, login or unknown/new application routes.
    location / { return 404; }
}
