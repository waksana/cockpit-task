name: Milestone
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing successful v0.0.0-rolling.N tag
        type: string
        required: true
      confirm_tag:
        description: Repeat the selected tag to confirm in-place promotion
        type: string
        required: true
permissions:
  contents: read
jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Verify original bytes and promote original Release only
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          CONFIRM_TAG: ${{ inputs.confirm_tag }}
        run: node scripts/rolling-release.js promote
