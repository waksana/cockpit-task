<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="task-base-path" content="">
  <title>Cockpit Task · 工作台</title><link rel="stylesheet" href="/style.css">
</head>
<body>
  <a class="skip-link" href="#main">跳到工作内容</a>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/" aria-label="Cockpit Task 工作台"><span class="brand-mark" aria-hidden="true">C<span></span></span><span>Cockpit <strong>Task</strong></span></a>
      <span class="workspace-label">工作台 <span class="readonly">只读</span></span>
      <div class="top-actions"><span id="connection" class="connection" role="status">正在连接</span><button id="refresh" class="button">刷新</button></div>
    </div>
  </header>
  <main id="main" tabindex="-1">
    <div id="error" class="message error" role="alert" hidden></div>
    <a id="reopen" class="button reopen" href="/" hidden>重新打开工作页</a>
    <div id="loading" class="loading" role="status"><span class="loading-mark" aria-hidden="true"></span>正在读取工作记录…</div>
    <section id="board" hidden aria-label="工作总览">
      <section class="overview" aria-labelledby="overview-title">
        <div class="overview-heading"><div><p class="eyebrow">WORKSPACE / OVERVIEW</p><h1 id="overview-title">工作概览</h1><p class="muted">先看正在推进的工作，再安排下一件事。</p></div><div class="snapshot-label"><span>最近读取</span><time id="updated">—</time></div></div>
        <div id="overviewMetrics" class="metrics"></div>
        <p id="countNote" class="count-note">数量为当前筛选下已加载的记录，不是全量统计。</p>
      </section>
      <section class="worklist" aria-labelledby="list-title">
        <div class="list-toolbar"><div><h2 id="list-title">工作清单</h2><p class="muted">按工作阶段分组 · 各组独立加载</p></div>
          <form id="searchForm" role="search"><label class="sr-only" for="search">搜索工作及完成历史</label><input id="search" type="search" placeholder="搜索标题、工作流或摘要" autocomplete="off"><button class="button primary">搜索</button><button id="clearSearch" class="button" type="button" hidden>清除</button></form>
        </div>
        <nav id="filters" class="filters" aria-label="工作阶段筛选"></nav>
        <p id="searchResult" class="search-result" role="status" hidden></p>
        <div id="columns"></div>
      </section>
    </section>
    <section id="detail" hidden aria-label="工作详情"></section>
    <div id="announcer" class="sr-only" role="status" aria-live="polite"></div>
  </main>
  <footer><span>Cockpit Task</span><span>呈现最近报告的事实，不代表会话实时状态；不会自动派工或催办。</span></footer>
  <script src="/app.js" type="module"></script>
</body>
</html>
